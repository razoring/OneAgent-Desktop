<hbox flex="1" id="browser">
  <box context="sidebar-context-menu" id="sidebar-container" hidden="true">
    <html:sidebar-main flex="1">
      <box id="vertical-tabs" slot="tabstrip" customizable="true" contextmenu="toolbar-context-menu"></box>
    </html:sidebar-main>
  </box>
  <box id="sidebar-launcher-splitter" class="chromeclass-extrachrome sidebar-splitter"/>
  <vbox id="sidebar-box" hidden="true" class="chromeclass-extrachrome">
    <box id="sidebar-header" align="center">
      <toolbarbutton id="sidebar-switcher-target" class="tabbable" aria-expanded="false">
        <image id="sidebar-icon" consumeanchor="sidebar-switcher-target"/>
        <label id="sidebar-title" crop="end" control="sidebar"/>
        <image id="sidebar-switcher-arrow"/>
      </toolbarbutton>
      <image id="sidebar-throbber"/>
      <spacer id="sidebar-spacer"/>
      <toolbarbutton id="sidebar-close" class="close-icon tabbable" data-l10n-id="sidebar-close-button"/>
    </box>
    <stack class="sidebar-browser-stack">
      <browser id="sidebar" autoscroll="false" disablehistory="true" disablefullscreen="true" tooltip="aHTMLTooltip"/>
    </stack>
  </vbox>
  <splitter id="sidebar-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true" role="separator" aria-controls="sidebar-box" data-l10n-id="sidebar-resize-splitter"/>
  <tabbox id="tabbrowser-tabbox" flex="1" tabcontainer="tabbrowser-tabs">
    <tabpanels id="tabbrowser-tabpanels" flex="1" selectedIndex="0"/>
  </tabbox>
  <splitter id="ai-window-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="sibling" collapsed="true"/>
  <vbox id="ai-window-box" collapsed="true" class="chromeclass-extrachrome ai-window-right-sidebar">
    <stack class="ai-window-browser-stack" flex="1">
    </stack>
  </vbox>
  <splitter id="appbar-splitter" class="chromeclass-extrachrome sidebar-splitter appbar-splitter" resizebefore="sibling" resizeafter="none" hidden="true" role="separator" aria-controls="appbar-box"/>
  <vbox id="appbar-box" hidden="true" class="chromeclass-extrachrome">
    <stack id="appbar-browser-stack" class="sidebar-browser-stack appbar-browser-stack" flex="1">
      <browser id="appbar" autoscroll="false" disablehistory="true" disablefullscreen="true" tooltip="aHTMLTooltip"/>
    </stack>
    <box id="appbar-bottom-bar" align="center">
      <box id="appbar-urlbar-container" align="center" flex="1">
        <box id="appbar-identity-box" align="center">
          <box id="appbar-identity-button" role="button" class="identity-box-button verifiedDomain secure" tooltiptext="Connection secure">
            <image id="appbar-identity-icon" class="identity-box-icon" src="chrome://browser/skin/trust-icon-active.svg"/>
          </box>
        </box>
        <html:input id="appbar-url-input" type="text" spellcheck="false" placeholder="Search or enter address"/>
      </box>
      <toolbarbutton id="appbar-reload-button" class="toolbarbutton-1" tooltiptext="Reload page">
        <image class="toolbarbutton-icon" src="chrome://global/skin/icons/reload.svg"/>
      </toolbarbutton>
      <toolbarbutton id="appbar-open-tab-button" class="toolbarbutton-1" tooltiptext="Open in browser tab">
        <image class="toolbarbutton-icon" src="chrome://global/skin/icons/open-in-new.svg"/>
      </toolbarbutton>
      <toolbarbutton id="appbar-toggle-mobile-button" class="toolbarbutton-1" tooltiptext="Toggle desktop/mobile view">
        <image class="toolbarbutton-icon" src="chrome://browser/skin/device-phone.svg"/>
      </toolbarbutton>
      <toolbarbutton id="appbar-close" class="close-icon tabbable" tooltiptext="Close app" data-l10n-id="sidebar-close-button"/>
    </box>
  </vbox>
  <box id="appbar-launcher-splitter" class="chromeclass-extrachrome sidebar-splitter appbar-splitter"/>
  <box context="appbar-context-menu" id="appbar-container">
    <html:appbar-main flex="1">
      <box id="appbar-vertical-tabs" slot="tabstrip"></box>
    </html:appbar-main>
  </box>
</hbox>
