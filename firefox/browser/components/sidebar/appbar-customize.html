<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src resource: chrome:; object-src 'none'; img-src data: chrome: https: http:; style-src 'unsafe-inline' chrome:;" />
    <title>Add apps</title>
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="chrome://browser/content/sidebar/sidebar.css" />
    <script src="chrome://browser/content/contentTheme.js"></script>
    <style>
      @import url("chrome://global/content/elements/moz-box.tokens.css");
      @import url("chrome://global/content/elements/moz-toggle.tokens.css");

      :root {
        --appbar-page-bg: var(--sidebar-background-color, var(--background-color-canvas));
        --appbar-page-color: var(--sidebar-text-color, var(--text-color));
        --appbar-deemphasized: var(--text-color-deemphasized);
        --appbar-focus: var(--focus-outline-color);

        &[lwt-sidebar="light"] {
          color-scheme: light;
        }

        &[lwt-sidebar="dark"] {
          color-scheme: dark;
        }

        background-color: var(--appbar-page-bg);
        color: var(--appbar-page-color);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--space-medium);
        font: message-box;
        font-size: inherit;
        background-color: transparent;
        color: inherit;
        line-height: 1.4;
        user-select: none;
        overflow-x: hidden;
        scrollbar-width: thin;
      }

      /* Panel Header */
      .panel-header {
        margin: 0 0 var(--space-large);
      }

      .panel-header h1 {
        font-size: var(--font-size-xlarge, 1.46em);
        font-weight: 600;
        margin: 0;
        color: inherit;
      }

      /* Sections & Cards */
      .section {
        margin: 0 0 var(--space-xlarge);
      }

      .card {
        border-radius: var(--box-border-radius);
        outline: var(--box-border);
        overflow: hidden;
      }

      .card > *:not(:last-child) {
        border-block-end: var(--box-border);
      }

      .card-header-row,
      .card-title-block,
      .search-container {
        padding: var(--box-padding);
      }

      .card-header-row {
        display: flex;
        align-items: center;
        gap: var(--space-xsmall);
      }

      .card-header-icon {
        width: var(--box-icon-size);
        height: var(--box-icon-size);
        fill: currentColor;
        -moz-context-properties: fill;
      }

      .card-header-title {
        font-size: 1em;
        font-weight: 600;
        color: inherit;
        margin: 0;
      }

      .card-title-block h2 {
        font-size: 1em;
        font-weight: 600;
        margin: 0 0 var(--space-xsmall);
        color: inherit;
      }

      .card-title-block p {
        font-size: var(--font-size-small);
        color: var(--appbar-deemphasized);
        margin: 0;
      }

      /* Frequently Visited Grid - max 2 rows, flexible & responsive */
      .tiles-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
        gap: var(--space-xsmall);
        padding: var(--box-padding);
      }

      .app-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-xsmall) var(--space-xxsmall);
        border-radius: var(--box-border-radius-inner);
        background-color: transparent;
        border: var(--box-border);
        cursor: pointer;
        text-align: center;
        transition: background-color 150ms ease;
      }

      .app-tile:hover {
        background-color: var(--box-button-background-color-hover);
        color: var(--box-button-text-color-hover);
      }

      .app-tile:active {
        background-color: var(--box-button-background-color-active);
        color: var(--box-button-text-color-active);
      }

      .app-tile .tile-icon {
        width: var(--box-icon-size);
        height: var(--box-icon-size);
        border-radius: var(--border-radius-small);
        object-fit: contain;
        margin-bottom: var(--space-xsmall);
      }

      .app-tile .tile-title {
        font-size: var(--font-size-small);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Manage Apps Tile with Close Button */
      .manage-tile {
        position: relative;
      }

      .manage-tile .tile-close-btn {
        position: absolute;
        top: var(--space-xxsmall);
        inset-inline-end: var(--space-xxsmall);
        width: 20px;
        height: 20px;
        appearance: none;
        margin: 0;
        padding: 0;
        min-width: 0;
        min-height: 0;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: inherit;
        opacity: 0.6;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 150ms ease, background-color 150ms ease;
      }

      .manage-tile:hover .tile-close-btn {
        opacity: 0.9;
        background-color: var(--box-button-background-color-hover);
      }

      .manage-tile .tile-close-btn:hover {
        opacity: 1;
        background-color: var(--icon-color-critical);
        color: var(--button-text-color-destructive);
      }

      .manage-tile .tile-close-btn img {
        width: 12px;
        height: 12px;
        fill: currentColor;
        -moz-context-properties: fill;
      }

      /* Search Bar - styled like about:preferences */
      .search-container {
        position: relative;
        width: 100%;
      }

      .search-form {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      .search-icon {
        position: absolute;
        inset-inline-start: var(--space-xsmall);
        width: var(--box-icon-size);
        height: var(--box-icon-size);
        color: var(--appbar-deemphasized);
        pointer-events: none;
        -moz-context-properties: fill;
        fill: currentColor;
      }

      .search-input {
        padding-inline-start: calc(var(--box-icon-size) + 2 * var(--space-xsmall));
        background-color: var(--background-color-box);
        border-radius: var(--border-radius-medium);
      }

      .search-input::placeholder {
        color: var(--appbar-deemphasized);
      }

      .search-clear-btn {
        position: absolute;
        inset-inline-end: var(--space-xsmall);
        appearance: none;
        background: transparent;
        border: none;
        cursor: pointer;
        color: inherit;
        margin: 0;
        min-width: 0;
        min-height: 0;
        padding: var(--space-xxsmall);
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      button.search-clear-btn:hover {
        background-color: var(--box-button-background-color-hover);
        border-color: transparent;
      }

      .search-clear-btn img {
        width: 12px;
        height: 12px;
        -moz-context-properties: fill;
        fill: currentColor;
      }

      /* Autocomplete Dropdown */
      .autocomplete-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        inset-inline: 0;
        z-index: 1000;
        background-color: var(--appbar-page-bg);
        border: var(--box-border);
        border-radius: var(--border-radius-medium);
        box-shadow: var(--box-shadow-level-3);
        max-height: 240px;
        overflow-y: auto;
        display: none;
        padding: var(--space-xxsmall);
      }

      .autocomplete-item {
        display: flex;
        align-items: center;
        gap: var(--space-xsmall);
        padding: var(--space-xxsmall) var(--space-xsmall);
        border-radius: var(--border-radius-small);
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      .autocomplete-item:hover,
      .autocomplete-item.selected {
        background-color: var(--box-button-background-color-hover);
      }

      .autocomplete-item .item-icon {
        width: var(--box-icon-size);
        height: var(--box-icon-size);
        flex-shrink: 0;
        object-fit: contain;
      }

      .autocomplete-item .item-text {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .autocomplete-item .item-title {
        font-size: var(--font-size-small);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .autocomplete-item .item-url {
        font-size: var(--font-size-small);
        color: var(--appbar-deemphasized);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Pinned Apps List - rows segmented like moz-box-group items */
      .pinned-list-container {
        border-radius: var(--box-border-radius-inner);
        overflow: hidden;
      }

      .pinned-row {
        display: flex;
        align-items: center;
        gap: var(--space-xsmall);
        padding: var(--space-small) var(--box-padding);
        cursor: default;
      }

      .pinned-row + .pinned-row {
        border-block-start: var(--box-border);
      }

      .pinned-row:hover {
        background-color: var(--box-button-background-color-hover);
      }

      .pinned-row.dragging {
        opacity: 0.4;
      }

      .pinned-row.drag-over-top {
        border-block-start: 2px solid var(--appbar-focus);
      }

      .pinned-row.drag-over-bottom {
        border-block-end: 2px solid var(--appbar-focus);
      }

      .drag-handle {
        width: 18px;
        height: 18px;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.45;
        flex-shrink: 0;
        transition: opacity 150ms ease;
      }

      .drag-handle:hover {
        opacity: 0.9;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .drag-handle img {
        width: 14px;
        height: 14px;
        fill: currentColor;
        -moz-context-properties: fill;
      }

      .pinned-icon {
        width: var(--box-icon-size);
        height: var(--box-icon-size);
        object-fit: contain;
        flex-shrink: 0;
        fill: currentColor;
        -moz-context-properties: fill;
      }

      .pinned-title {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pinned-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xsmall);
        flex-shrink: 0;
      }

      /* Toggle Switch - moz-toggle tokens, as rendered in about:preferences */
      .toggle-switch {
        appearance: none;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        min-width: 0;
        min-height: 0;
        flex-shrink: 0;
        color: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
      }

      button.toggle-switch:hover {
        background-color: transparent;
        border-color: transparent;
      }

      .toggle-track {
        width: var(--toggle-width);
        height: var(--toggle-height);
        border: var(--toggle-border-width) solid var(--toggle-border-color);
        border-radius: var(--toggle-border-radius);
        background-color: var(--toggle-background-color);
        box-sizing: border-box;
        display: block;
        position: relative;
      }

      button.toggle-switch:hover .toggle-track {
        background-color: var(--toggle-background-color-hover);
        border-color: var(--toggle-border-color-hover);
      }

      button.toggle-switch:active .toggle-track {
        background-color: var(--toggle-background-color-active);
        border-color: var(--toggle-border-color-active);
      }

      .toggle-thumb {
        position: absolute;
        top: var(--toggle-dot-margin);
        inset-inline-start: var(--toggle-dot-margin);
        width: var(--toggle-dot-width);
        height: var(--toggle-dot-height);
        border-radius: var(--toggle-border-radius);
        background-color: var(--toggle-dot-background-color);
      }

      @media (prefers-reduced-motion: no-preference) {
        .toggle-thumb {
          transition: translate 100ms;
        }
      }

      .toggle-switch.active .toggle-track {
        background-color: var(--toggle-background-color-pressed);
        border-color: transparent;
      }

      button.toggle-switch.active:hover .toggle-track {
        background-color: var(--toggle-background-color-pressed-hover);
      }

      button.toggle-switch.active:active .toggle-track {
        background-color: var(--toggle-background-color-pressed-active);
      }

      .toggle-switch.active .toggle-thumb {
        background-color: var(--toggle-dot-background-color-on-pressed);
        translate: var(--toggle-dot-transform-x) 0;
      }

      /* Delete button */
      .btn-delete {
        appearance: none;
        background: transparent;
        border: none;
        cursor: pointer;
        color: inherit;
        opacity: 0.6;
        padding: var(--space-xxsmall);
        margin: 0;
        min-width: 0;
        min-height: 0;
        border-radius: var(--border-radius-small);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        transition: opacity 150ms ease, background-color 150ms ease;
      }

      button.btn-delete:hover {
        opacity: 1;
        background-color: var(--box-button-background-color-hover);
        border-color: transparent;
      }

      .btn-delete img {
        width: 14px;
        height: 14px;
        fill: currentColor;
        -moz-context-properties: fill;
      }

      /* Empty State */
      .empty-state-text {
        font-size: var(--font-size-small);
        color: var(--appbar-deemphasized);
        text-align: center;
        padding: var(--space-small);
        margin: 0;
      }
    </style>
    </style>
    <script src="chrome://browser/content/sidebar/appbar-customize.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <div class="panel-header">
      <h1>Add apps</h1>
    </div>

    <!-- Frequently Visited Section -->
    <div class="section" id="section-freq-visited">
      <div class="card">
        <div class="card-header-row">
          <img class="card-header-icon" src="chrome://global/skin/icons/defaultFavicon.svg" alt="" />
          <h2 class="card-header-title">Frequently visited</h2>
        </div>
        <div id="freq-grid" class="tiles-grid freq-grid"></div>
      </div>
    </div>

    <!-- Pinned Apps Section -->
    <div class="section" id="section-pinned-apps">
      <div class="card">
        <div class="card-title-block">
          <h2>Pinned apps</h2>
          <p>Reposition where apps appear and edit their visibility.</p>
        </div>

        <!-- Search Bar with Autocomplete -->
        <div class="search-container">
          <form id="add-form" class="search-form" autocomplete="off">
            <img class="search-icon" src="chrome://global/skin/icons/search-glass.svg" alt="" />
            <input
              id="url"
              class="search-input"
              type="text"
              placeholder="Enter URL or search favorites"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="search-clear-btn" type="button" class="search-clear-btn" title="Clear input">
              <img src="chrome://global/skin/icons/close.svg" alt="Clear" />
            </button>
          </form>
          <div id="autocomplete-dropdown" class="autocomplete-dropdown"></div>
        </div>

        <!-- Reorderable List of Pinned Apps -->
        <div id="pinned-list" class="pinned-list-container"></div>
      </div>
    </div>

    <!-- Manage Apps Section (Active Apps) -->
    <div class="section" id="section-manage-apps">
      <div class="card">
        <div class="card-title-block">
          <h2>Manage apps</h2>
          <p>Close currently active apps to save memory.</p>
        </div>
        <div id="manage-grid" class="tiles-grid"></div>
      </div>
    </div>
  </body>
</html>
