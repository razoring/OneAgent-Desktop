<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Customize Appbar</title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <style>
      body { padding: 12px; }
      h1 { font-size: 1.2em; margin: 0 0 12px; }
      form { display: flex; gap: 6px; margin-bottom: 12px; }
      form input { flex: 1; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
      li img { width: 16px; height: 16px; }
      li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
    <script src="chrome://browser/content/sidebar/appbar-customize.js" defer></script>
  </head>
  <body>
    <h1>Customize Appbar</h1>
    <form id="add-form">
      <input id="url" type="text" placeholder="https://example.com" />
      <button type="submit" class="primary">Add</button>
    </form>
    <ul id="apps"></ul>
  </body>
</html>
